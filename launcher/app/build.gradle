plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kulwant.atvhome'
    compileSdk 34

    defaultConfig {
        applicationId 'com.kulwant.atvhome'
        minSdk 28
        //noinspection ExpiredTargetSdkVersion  sideloaded TV launcher, matches the TV's API level
        targetSdk 28
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
}
